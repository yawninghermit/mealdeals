<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faece7"/>
      <stop offset="1" stop-color="#f7f5f2"/>
    </linearGradient>
    <style>
      .title { font: 700 96px 'DM Sans', system-ui, sans-serif; fill: #1a1816; letter-spacing: 0; }
      .accent { fill: #d85a30; }
      .tagline { font: 600 36px 'DM Sans', system-ui, sans-serif; fill: #6b6560; }
      .url { font: 600 22px 'DM Sans', system-ui, sans-serif; fill: #a09a93; letter-spacing: 1px; }
      .pill { font: 700 22px 'DM Sans', system-ui, sans-serif; fill: #993c1d; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative accent strip on left -->
  <rect x="0" y="0" width="12" height="630" fill="#d85a30"/>

  <!-- Big bowl/plate emoji-like circle for visual -->
  <g transform="translate(900, 200)">
    <circle cx="120" cy="120" r="140" fill="#ffffff" stroke="#e5e1da" stroke-width="2"/>
    <circle cx="120" cy="120" r="110" fill="#faece7"/>
    <text x="120" y="170" font-size="140" text-anchor="middle">🍔</text>
  </g>

  <!-- Title -->
  <text x="80" y="240" class="title">ih8<tspan class="accent">fullprice</tspan></text>

  <!-- Tagline -->
  <text x="80" y="310" class="tagline">Find food deals near you.</text>

  <!-- Feature pills -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" rx="22" ry="22" width="180" height="44" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/>
    <text x="90" y="30" class="pill" text-anchor="middle">Breakfast</text>

    <rect x="200" y="0" rx="22" ry="22" width="140" height="44" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/>
    <text x="270" y="30" class="pill" text-anchor="middle">Lunch</text>

    <rect x="360" y="0" rx="22" ry="22" width="150" height="44" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/>
    <text x="435" y="30" class="pill" text-anchor="middle">Dinner</text>
  </g>

  <!-- URL at bottom -->
  <text x="80" y="570" class="url">IH8FULLPRICE.COM</text>
</svg>
